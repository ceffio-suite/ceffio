# Example configuration. The installer does not read this file yet; it mirrors
# the layers the code actually deploys (see the README's component table).
domain: company.fr
profile: business-50

runtime:
  type: k3s

features:
  mail: true
  office: true
  video: true
  monitoring: true

identity:
  provider: keycloak

files:
  provider: nextcloud

office:
  provider: onlyoffice

talk: # chat + video: Nextcloud Talk with the Janus high-performance backend
  provider: talk

mail:
  provider: stalwart

storage:
  provider: local

tls:
  provider: letsencrypt