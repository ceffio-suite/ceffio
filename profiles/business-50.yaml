#
# Reference profile for ~50 concurrent users — sizing guidance only: the
# installer does not parse this file yet (`--profile` is displayed, not
# applied). Component names match the version registry
# (internal/version/version.go); the Talk media stack (signaling + janus +
# coturn + nats) replaced the removed matrix/jitsi components.
name: business-50

capacity:
  users: 50

requirements:
  cpu: 16
  memory: 64Gi
  systemDisk: 500Gi
  dataDisk: 2Ti

resources:
  keycloak:
    memory: 2Gi
  postgres:
    memory: 6Gi
  valkey: # Redis-compatible cache; ConfigMap/Deployment are named ceffio-valkey
    memory: 2Gi
  nextcloud:
    memory: 8Gi
  onlyoffice:
    memory: 6Gi
  talk: # signaling + janus + coturn + nats
    memory: 4Gi
  mail:
    memory: 6Gi
  observability:
    memory: 6Gi
