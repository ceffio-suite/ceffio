# Reference profile for high-availability deployments — sizing guidance
# only, not parsed by the installer yet. The media stack is Janus (SFU):
# "multipleJVB" was Jitsi terminology from the removed stack.
name: enterprise-ha

requirements:
  nodes: 3+
  haPostgreSQL: true
  distributedStorage: true
  multipleIngressReplicas: true
  multipleSFU: true # Janus replicas behind the signaling server
  antiAffinity: true
  podDisruptionBudgets: true
