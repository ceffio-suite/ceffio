# Ceffio login theme for Keycloak 26.
#
# It EXTENDS keycloak.v2 instead of copying it: no template is overridden, so
# a Keycloak upgrade keeps every page, every flow and every fix, and this theme
# only changes the look. The parent's stylesheet is kept (css/styles.css is
# resolved from keycloak.v2) and ceffio.css is applied after it.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/ceffio.css

# keycloak.v2 follows the browser's light/dark preference. ceffio.css themes
# both.
darkMode=true
