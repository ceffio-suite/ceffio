# Valeurs du chart umbrella Ceffio.
# Ce chart possède les namespaces de la plateforme (Phase 2).
# Les sous-charts applicatifs arrivent dans les phases suivantes.

global:
  partOf: ceffio
  managedBy: ceffio-operator

# Noms logiques des namespaces applicatifs. Le template rend "ceffio-<nom>".
# NB : "ceffio-system" est le namespace de la release helm (créé par --create-namespace)
# et ne doit PAS être redéclaré ici sinon conflit "already exists" au déploiement.
namespaces:
  identity: {}
  data: {}
  files: {}
  office: {}
  chat: {}
  video: {}
  mail: {}
  observability: {}

# cert-manager (installé à part, au niveau cluster).
certmanager:
  repo: jetstack
  version: v1.21.1
  namespace: cert-manager
  installCRDs: true