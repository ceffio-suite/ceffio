# Issues are not the channel for a vulnerability: a public report is indexed
# within hours, and the reporter has no way to withdraw it. This link is the
# first thing GitHub shows when someone opens the "new issue" page.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/ceffio-suite/ceffio/security/advisories/new
    about: Never in a public issue. Private reporting, or security@mandem-it.com — see SECURITY.md.
