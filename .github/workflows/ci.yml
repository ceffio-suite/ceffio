name: CI

# WHY THIS CI EXISTS — AND WHY IT BUILDS THE BINARY.
#
# As long as nothing automated the project, a compilation error could live in
# the repository for days: it only surfaced when someone ran `go build` on
# their machine. That happened, in this repository, and it is exactly what a
# CI exists to prevent.
#
# It has several stages, from cheapest to most expensive:
#   1. formatting and vet — a few seconds, catch mistakes;
#   2. compilation — catches what vet cannot see;
#   3. tests, with the race detector on (concurrency failures do not show up
#      in a sequential `go test`);
#   4. the REAL build of the binary for production architectures, published
#      as a downloadable artifact.
#
# THE POINT THAT MATTERS: the artifact. A green `go build` in a CI log does
# not prove a usable binary exists. By publishing the file, it can be
# DOWNLOADED and RUN — the only verification that counts.
#
# BRANCHES: CI runs on main and develop (the GitFlow branches, see
# CONTRIBUTING.md) and on every pull request targeting them. Releases are NOT
# built here — the `release.yml` workflow owns tags, so a tag is never built
# twice by two different definitions of "done".

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # A VULNERABILITY FOUND AFTER THE RELEASE MUST BE SEEN WITHOUT WAITING FOR THE
  # NEXT ONE. Weekly, on the published images.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, vet and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests (with race detection)
        run: go test -race ./...

      - name: Module proof (demo build tag)
        # WHY THIS STEP EXISTS: internal/modules/demo carries the proof of the
        # module system's promise — that a feature is added by writing only its
        # own package, touching neither the console nor the CLI. That proof is
        # guarded by a build tag, so the run above never compiles it: the test
        # was written, reviewed, and never executed. A regression that rewired
        # the demo feature by hand into the console would therefore pass CI in
        # silence, which is exactly the defect the proof exists to catch.
        #
        # It runs as its own step rather than through `./...` because the tag
        # would then apply to every package, linking the demo module into the
        # CLI and console tests that have no use for it.
        run: go test -race -tags demo ./internal/modules/... ./internal/console/... ./cmd/...

      - name: Version registry coherence
        # The test carries the promise written in internal/version: no image
        # on `latest`, all versions pinned, and the vault properly declared.
        run: go test ./internal/version/ -v -run 'TestRegistry|TestAucuneVersion|TestImages|TestOpenBao'

  binary:
    name: build binary (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: quality
    strategy:
      matrix:
        include:
          - { goarch: amd64, suffixe: linux-amd64 }
          - { goarch: arm64, suffixe: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # The version string is injected, never invented: a displayed version
          # that matches nothing is worse than no version at all, because it
          # makes people believe they know what is running.
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/ceffio-suite/ceffio/internal/version.Binary=${VERSION} -X github.com/ceffio-suite/ceffio/internal/version.Commit=${COMMIT} -X github.com/ceffio-suite/ceffio/internal/version.Date=${DATE}" \
            -o "bin/ceffio-${VERSION}-linux-${GOARCH}" ./cmd/ceffio
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate the SBOM (not published)
        # THE SAME TOOL AS THE RELEASE, ON THE SAME ARTEFACT, WITHOUT PUBLISHING:
        # a Syft regression or a broken Go build-info must fail here, months
        # before the release day, not on the day the release cannot go out.
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Write the SBOM (not published)
        run: |
          set -euo pipefail
          BIN="bin/ceffio-${VERSION}-linux-${{ matrix.goarch }}"
          syft scan "file:${BIN}" -o "cyclonedx-json=${BIN}.cdx.json" --quiet
          # ZERO COMPONENTS MEANS THE TOOL SILENTLY STOPPED READING GO BUILD
          # INFO. The SBOM would still be valid JSON, still be published, and
          # describe nothing — the worst possible outcome for a document whose
          # whole purpose is to be trusted.
          COMPOSANTS="$(python3 -c "import json; d=json.load(open('${BIN}.cdx.json')); print(len(d.get('components', [])))")"
          echo "SBOM for ${{ matrix.goarch }}: $COMPOSANTS components"
          test "$COMPOSANTS" -gt 0

      - name: Scan the SBOM with Grype
        # THE GATE THE PLAN ASKS FOR: a CRITICAL vulnerability FOR WHICH A FIX
        # EXISTS fails the build. Everything else is reported, not blocked — a
        # CI that stops on every unfixed low finding is a CI people disable.
        #
        # `only-fixed` + `severity-cutoff: critical` is exactly that rule, and
        # it is Grype's own, not a re-implementation: verified in the flags of
        # v0.121.0 (`--fail-on`, `--only-fixed`).
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # `${{ env.VERSION }}`, NOT `${VERSION}`: a `with:` value is a YAML
          # string that GitHub expands before the step runs, and the shell's
          # `${VERSION}` is not a shell there — the first run passed the literal
          # text to Grype, which then scanned nothing and failed on a missing
          # file. Caught by the CI itself, which is what it is for.
          sbom: "bin/ceffio-${{ env.VERSION }}-linux-${{ matrix.goarch }}.cdx.json"
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: "grype-${{ matrix.goarch }}.json"
          grype-version: v0.121.0
          cache-db: true

      - name: Summarise the scan
        # RUN EVEN WHEN THE GATE FAILS: the counts are what tells an operator
        # whether the failure is one finding or forty.
        if: always()
        run: |
          set -euo pipefail
          RAPPORT="grype-${{ matrix.goarch }}.json"
          if [ ! -s "$RAPPORT" ]; then
            echo "### Grype (${{ matrix.goarch }})

          no report produced — the scan did not run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$RAPPORT" "${{ matrix.goarch }}" >> "$GITHUB_STEP_SUMMARY" <<'FIN_PYTHON'
          import json, sys
          rapport, arch = sys.argv[1], sys.argv[2]
          d = json.load(open(rapport))
          matches = d.get("matches") or []
          ordre = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          compte = {s: [0, 0] for s in ordre}   # [total, avec correctif]
          for m in matches:
              sev = (m.get("vulnerability") or {}).get("severity") or "Unknown"
              fixe = ((m.get("vulnerability") or {}).get("fix") or {}).get("state") == "fixed"
              if sev not in compte:
                  sev = "Unknown"
              compte[sev][0] += 1
              if fixe:
                  compte[sev][1] += 1
          print("### Grype, binaire %s" % arch)
          print()
          print("| Sévérité | Total | Avec correctif |")
          print("|---|---|---|")
          for s in ordre:
              total, fixe = compte[s]
              if total or s == "Critical":
                  print("| %s | %d | %d |" % (s, total, fixe))
          print()
          print("%d vulnérabilité(s) au total, %d avec un correctif."
                % (sum(c[0] for c in compte.values()), sum(c[1] for c in compte.values())))
          FIN_PYTHON

      - name: Verify the produced binary
        # We do not just note that the build finished: we RUN what was just
        # produced, when that is possible.
        #
        # WHEN IT IS NOT POSSIBLE, AND WHY WE SAY SO: an arm64 binary does not
        # run on an amd64 runner. Trying to launch it would fail CI for a
        # reason that has nothing to do with code quality — this happened
        # twice while writing this file. So we only execute the runner's
        # NATIVE architecture, and state clearly that the other was not
        # executed. A published artifact that was never run must say so, not
        # hide it.
        #
        # The commands run are chosen on purpose: there is NO `version`
        # subcommand in this project. We exercise the real command tree —
        # general help and two command paths.
        run: |
          set -euo pipefail
          BIN="bin/ceffio-${VERSION}-linux-${{ matrix.goarch }}"
          test -x "$BIN" || { echo "::error::the binary is not executable"; exit 1; }
          file "$BIN"

          NATIVE="$(go env GOARCH)"
          if [ "${{ matrix.goarch }}" != "$NATIVE" ]; then
            echo "architecture ${{ matrix.goarch }}: built but NOT executed here (runner $NATIVE)."
            echo "Full verification to be done on a ${{ matrix.goarch }} machine."
            exit 0
          fi

          ./"$BIN" --help > /dev/null
          ./"$BIN" install --help > /dev/null
          ./"$BIN" status --help > /dev/null
          echo "the binary starts and its command tree responds"

      - uses: actions/upload-artifact@v7
        with:
          name: ceffio-${{ matrix.suffixe }}
          path: bin/ceffio-*-linux-*
          if-no-files-found: error
          retention-days: 90

  console-image:
    # THE DOCKERFILE IS VERIFIED ON EVERY PULL REQUEST, WITHOUT PUSHING ANYTHING.
    # A broken Dockerfile must not be discovered on release day: this job
    # builds the multi-architecture image exactly as release.yml does, but
    # without --push. The "from scratch" image executes no instruction at
    # build time (no RUN): both architectures build on the amd64 runner
    # without emulation.
    #
    # The binaries come from the artifacts of the `binary` job — as in
    # release.yml, the image is never built from a separate compilation that
    # could diverge from what is published.
    name: build the console image (no push)
    runs-on: ubuntu-24.04
    needs: binary
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: ceffio-linux-amd64
          path: tmp/amd64

      - uses: actions/download-artifact@v7
        with:
          name: ceffio-linux-arm64
          path: tmp/arm64

      - name: Lay the binaries out as the Dockerfile expects
        # The Dockerfile copies dist/ceffio-linux-${TARGETARCH}: the CI artifacts
        # carry a versioned name (ceffio-<VERSION>-linux-<arch>), so they are
        # put back under the canonical name. `find` rather than a hardcoded
        # path: upload-artifact stores files relative to the common ancestor
        # of the matches, so the presence of the `bin/` prefix is not
        # guaranteed.
        #
        # chmod +x IS REQUIRED: download-artifact does not preserve the
        # executable bit, and the release workflow's identical step failed on
        # exactly that (see release.yml).
        run: |
          set -euo pipefail
          mkdir -p dist
          find tmp/amd64 -type f -name 'ceffio-*-linux-amd64' -exec cp {} dist/ceffio-linux-amd64 \;
          find tmp/arm64 -type f -name 'ceffio-*-linux-arm64' -exec cp {} dist/ceffio-linux-arm64 \;
          test -f dist/ceffio-linux-amd64
          test -f dist/ceffio-linux-arm64
          chmod +x dist/ceffio-linux-amd64 dist/ceffio-linux-arm64
          ls -la dist/

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for both architectures
        # NO --push: this job does not even have `packages: write`, so a push
        # would fail structurally rather than by accident. The local tag is
        # enough to prove the build succeeds for each platform.
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f build/console/Dockerfile \
            -t ceffio-console:ci \
            .

  # A VULNERABILITY DISCOVERED AFTER A RELEASE MUST BE SEEN WITHOUT WAITING FOR
  # THE NEXT ONE. Once a week, the images we actually published are scanned
  # again — the SBOM of the release does not change, the vulnerability database
  # does.
  scan-published:
    name: scan the published images
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve what to scan
        # THE LAST RELEASE, NOT `latest`: `latest` follows the newest stable tag,
        # but the weekly job must report on what an operator is running today —
        # which is the last published release.
        id: cibles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --json tagName -q .tagName)"
          VERSION="${TAG#v}"
          echo "console=ghcr.io/ceffio-suite/ceffio:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "capture=ghcr.io/ceffio-suite/ceffio-capture:latest" >> "$GITHUB_OUTPUT"

      - name: Scan the console image
        id: console
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.cibles.outputs.console }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: grype-console.json
          grype-version: v0.121.0
          cache-db: true

      - name: Scan the capture image
        id: capture
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.cibles.outputs.capture }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: grype-capture.json
          grype-version: v0.121.0
          cache-db: true

      - name: Summarise the scans
        if: always()
        run: |
          set -euo pipefail
          for NOM in console capture; do
            RAPPORT="grype-${NOM}.json"
            if [ ! -s "$RAPPORT" ]; then
              echo "### Grype, image ${NOM} — aucun rapport produit" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            python3 - "$RAPPORT" "$NOM" >> "$GITHUB_STEP_SUMMARY" <<'FIN_PYTHON'
          import json, sys
          rapport, nom = sys.argv[1], sys.argv[2]
          d = json.load(open(rapport))
          matches = d.get("matches") or []
          ordre = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          compte = {s: [0, 0] for s in ordre}
          for m in matches:
              sev = (m.get("vulnerability") or {}).get("severity") or "Unknown"
              fixe = ((m.get("vulnerability") or {}).get("fix") or {}).get("state") == "fixed"
              if sev not in compte:
                  sev = "Unknown"
              compte[sev][0] += 1
              if fixe:
                  compte[sev][1] += 1
          print("### Grype, image %s" % nom)
          print()
          print("| Sévérité | Total | Avec correctif |")
          print("|---|---|---|")
          for s in ordre:
              total, fixe = compte[s]
              if total or s == "Critical":
                  print("| %s | %d | %d |" % (s, total, fixe))
          print()
          print("%d vulnérabilité(s) au total, %d avec un correctif."
                % (sum(c[0] for c in compte.values()), sum(c[1] for c in compte.values())))
          FIN_PYTHON
          done
