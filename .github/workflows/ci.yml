name: CI

# WHY THIS CI EXISTS — AND WHY IT BUILDS THE BINARY.
#
# As long as nothing automated the project, a compilation error could live in
# the repository for days: it only surfaced when someone ran `go build` on
# their machine. That happened, in this repository, and it is exactly what a
# CI exists to prevent.
#
# It has several stages, from cheapest to most expensive:
#   1. formatting and vet — a few seconds, catch mistakes;
#   2. compilation — catches what vet cannot see;
#   3. tests, with the race detector on (concurrency failures do not show up
#      in a sequential `go test`);
#   4. the REAL build of the binary for production architectures, published
#      as a downloadable artifact.
#
# THE POINT THAT MATTERS: the artifact. A green `go build` in a CI log does
# not prove a usable binary exists. By publishing the file, it can be
# DOWNLOADED and RUN — the only verification that counts.
#
# BRANCHES: CI runs on main and develop (the GitFlow branches, see
# CONTRIBUTING.md) and on every pull request targeting them. Releases are NOT
# built here — the `release.yml` workflow owns tags, so a tag is never built
# twice by two different definitions of "done".

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, vet and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests (with race detection)
        run: go test -race ./...

      - name: Version registry coherence
        # The test carries the promise written in internal/version: no image
        # on `latest`, all versions pinned, and the vault properly declared.
        run: go test ./internal/version/ -v -run 'TestRegistry|TestAucuneVersion|TestImages|TestOpenBao'

  binary:
    name: build binary (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: quality
    strategy:
      matrix:
        include:
          - { goarch: amd64, suffixe: linux-amd64 }
          - { goarch: arm64, suffixe: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # The version string is injected, never invented: a displayed version
          # that matches nothing is worse than no version at all, because it
          # makes people believe they know what is running.
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o "bin/ceffio-${VERSION}-linux-${GOARCH}" ./cmd/ceffio
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify the produced binary
        # We do not just note that the build finished: we RUN what was just
        # produced, when that is possible.
        #
        # WHEN IT IS NOT POSSIBLE, AND WHY WE SAY SO: an arm64 binary does not
        # run on an amd64 runner. Trying to launch it would fail CI for a
        # reason that has nothing to do with code quality — this happened
        # twice while writing this file. So we only execute the runner's
        # NATIVE architecture, and state clearly that the other was not
        # executed. A published artifact that was never run must say so, not
        # hide it.
        #
        # The commands run are chosen on purpose: there is NO `version`
        # subcommand in this project. We exercise the real command tree —
        # general help and two command paths.
        run: |
          set -euo pipefail
          BIN="bin/ceffio-${VERSION}-linux-${{ matrix.goarch }}"
          test -x "$BIN" || { echo "::error::the binary is not executable"; exit 1; }
          file "$BIN"

          NATIVE="$(go env GOARCH)"
          if [ "${{ matrix.goarch }}" != "$NATIVE" ]; then
            echo "architecture ${{ matrix.goarch }}: built but NOT executed here (runner $NATIVE)."
            echo "Full verification to be done on a ${{ matrix.goarch }} machine."
            exit 0
          fi

          ./"$BIN" --help > /dev/null
          ./"$BIN" install --help > /dev/null
          ./"$BIN" status --help > /dev/null
          echo "the binary starts and its command tree responds"

      - uses: actions/upload-artifact@v7
        with:
          name: ceffio-${{ matrix.suffixe }}
          path: bin/ceffio-*-linux-*
          if-no-files-found: error
          retention-days: 90
