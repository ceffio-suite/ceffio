name: Release

# ONE DEFINITION OF "DONE" FOR A RELEASE.
#
# A release here is a Git tag AND a GitHub Release with downloadable binaries
# AND their checksums. All three are produced by this single workflow, from
# the tag. Nothing else creates releases: `ci.yml` deliberately does not react
# to tags, so a version is never built twice by two pipelines that could
# disagree about what they built.
#
# WHY CHECKSUMS ARE NOT OPTIONAL: this project installs software on hosts that
# then hold an organisation's data. A binary downloaded with no way to verify
# it is a binary whose integrity is merely assumed. The checksums file is
# published next to the assets so the operator can verify BEFORE executing.
#
# THE RELEASE IS ATTACHED TO A GREEN CI: the job below waits for and then
# checks the CI runs of the commit the tag points at, and refuses to publish
# if they did not succeed. A release out of a red build is a trap for the
# first user who hits the bug.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)publish, must already exist. e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: build, verify and publish ${{ github.event.ref_name || inputs.tag }}
    runs-on: ubuntu-24.04
    # Creating a Release is the one thing this job needs write access to.
    # Everything else stays read-only on purpose.
    permissions:
      contents: write
    outputs:
      # Le job console-image dérive ses tags d'image de CETTE sortie : le tag
      # est résolu et validé une seule fois, puis réutilisé. Deux résolutions
      # indépendantes pourraient diverger (re-publication via workflow_dispatch
      # avec un tag saisi à la main, par exemple).
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A tag outside semver cannot be sorted, compared, or used to derive
          # "latest" — the release channel would become guesswork.
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid release tag: expected vMAJOR.MINOR.PATCH (suffix -rc.N allowed)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for the CI of the tagged commit, refuse it if not green
        # Verified against the commit the TAG points at, never against a
        # branch ref: "the last run of this ref" can be an older run, prior to
        # the change we mean to release.
        #
        # WAITING IS PART OF THE CHECK: the tag is pushed right after the
        # merge to main, while that merge's CI is still running. Reading the
        # status once would either fail for no reason or, worse, pass over an
        # empty list ("nothing to disprove").
        #
        # QUERIED BY WORKFLOW NAME, NOT BY CHECK-RUN NAME: the CI workflow is
        # named "CI"; matching its runs keeps this job out of its own verdict
        # (the Release job creates a check-run on the same commit as it runs —
        # filtering on job names inside it would make the release wait on
        # itself until the deadline and fail).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="$(git rev-list -n 1 "$TAG")"
          DEADLINE=$(( $(date +%s) + 900 ))
          while :; do
            gh run list --workflow CI --commit "$SHA" \
              --json databaseId,status,conclusion \
              --jq '.[] | "\(.databaseId) :: \(.status) :: \(.conclusion)"' \
              > /tmp/runs.txt || true
            if [ -s /tmp/runs.txt ] && ! grep -qvE ' :: completed :: (success|skipped)$' /tmp/runs.txt; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::CI of commit $SHA is not green (or was not found) after 15 minutes — nothing is published."
              cat /tmp/runs.txt || echo "(no CI run found)"
              exit 1
            fi
            sleep 20
          done
          cat /tmp/runs.txt
          echo "CI verified green on $SHA"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binaries
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X github.com/ceffio-suite/ceffio/internal/version.Binary=${TAG} -X github.com/ceffio-suite/ceffio/internal/version.Commit=${COMMIT} -X github.com/ceffio-suite/ceffio/internal/version.Date=${DATE}" \
              -o "dist/ceffio-linux-$ARCH" ./cmd/ceffio
          done
          ( cd dist && sha256sum ceffio-linux-* > checksums.txt )
          ls -la dist/

      - name: Exercise what will be shipped
        # The native architecture is RUN, not just built — see ci.yml for why
        # arm64 is not executed on an amd64 runner.
        run: |
          set -euo pipefail
          ./dist/ceffio-linux-amd64 --help > /dev/null
          ./dist/ceffio-linux-amd64 install --help > /dev/null
          echo "the shipped amd64 binary starts"

      - name: Share the binaries with the console image job
        # L'IMAGE DOIT CONTENIR LES BINAIRES DE LA RELEASE, OCTET POUR OCTET.
        # Le job console-image ne recompile JAMAIS : une seconde compilation
        # (autre date, autre ordre de linking) produirait un binaire différent
        # de celui que les opérateurs téléchargent et vérifient via
        # checksums.txt — l'image ne serait plus reproductible depuis la
        # release. C'est exactement le défaut de l'ancien dépôt ceffio-console.
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/ceffio-linux-amd64
            dist/ceffio-linux-arm64
          if-no-files-found: error

      - name: Write the release body
        # `generate_release_notes` keeps the changelog (the commits since the
        # previous tag); this body adds what a changelog cannot carry: how to
        # install, and how to verify the download.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          cat > RELEASE_BODY.md <<EOF
          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/installer/install.sh | sh -s -- install --domain <your-domain>
          \`\`\`

          Or download a binary directly:

          | File | Platform |
          |---|---|
          | \`ceffio-linux-amd64\` | x86_64 |
          | \`ceffio-linux-arm64\` | aarch64 |

          ## Verify before running

          \`\`\`bash
          sha256sum -c --ignore-missing checksums.txt
          \`\`\`
          EOF

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ceffio ${{ steps.tag.outputs.tag }}
          # A -rc tag is a prerelease: the release channel must not offer it
          # as "latest", or every user gets the candidate.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/ceffio-linux-amd64
            dist/ceffio-linux-arm64
            dist/checksums.txt
          body_path: RELEASE_BODY.md
        env:
          GH_TOKEN: ${{ github.token }}

  # L'IMAGE DE LA CONSOLE EST PUBLIÉE ICI, DEPUIS CE DÉPÔT, À PARTIR DES
  # BINAIRES DE LA RELEASE.
  #
  # Avant, elle était publiée par le dépôt séparé ceffio-suite/ceffio-console,
  # dont le workflow clonait ce dépôt en --depth 1 et RECOMPILE avec Go 1.24
  # alors que go.mod exige 1.27.1 : l'image ne correspondait à aucune release
  # vérifiable, et le compilateur ne respectait pas le contrat du code. Ici,
  # le job consomme l'artefact `binaries` du job release : ce qui tourne dans
  # l'image est octet pour octet ce que les opérateurs téléchargent et
  # vérifient via checksums.txt.
  console-image:
    name: publish the console image (${{ needs.release.outputs.tag }})
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: read
      # Publier sur GHCR est la seule écriture de ce job. Si la politique de
      # l'organisation restreint GITHUB_TOKEN sur packages:write (cas de
      # l'ancien dépôt ceffio-console), le repli documenté est un PAT stocké
      # dans secrets.GHCR_TOKEN avec le scope packages:write — remplacer
      # `password: ${{ github.token }}` par
      # `password: ${{ secrets.GHCR_TOKEN }}` dans l'étape de login.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the release binaries
        # Jamais de recompilation : voir l'en-tête du job.
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: dist

      - name: Check the downloaded binaries against the release checksums
        # Le téléchargement d'artefact passe par l'API GitHub, pas par la
        # release ; cette vérification prouve que l'artefact et la release
        # publiés par le job précédent sont bien les mêmes fichiers.
        run: |
          set -euo pipefail
          ls -la dist/
          test -x dist/ceffio-linux-amd64
          test -x dist/ceffio-linux-arm64
          # dist/checksums.txt n'est pas dans l'artefact (il n'est pas un
          # binaire) : on le télécharge depuis la release pour comparer.
          TAG="${{ needs.release.outputs.tag }}"
          curl -fsSL -o /tmp/checksums.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/checksums.txt"
          ( cd dist && sha256sum -c --ignore-missing /tmp/checksums.txt )

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the multi-architecture image
        # LE DOCKERFILE NE RECOMPILE RIEN : il copie dist/ceffio-linux-$ARCH
        # (sélectionné par TARGETARCH, fourni par BuildKit par plateforme).
        # Une image « from scratch » sans instruction RUN se construit pour
        # arm64 sur un runner amd64 sans émulation — il n'y a rien à exécuter.
        #
        # Tags : X.Y.Z toujours (règle du projet : tag = version, jamais
        # d'image flottante sans version) ; `latest` UNIQUEMENT pour une
        # version sans suffixe — un -rc.1 ne doit pas devenir la version que
        # tout le monde tire par défaut.
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/ceffio-suite/ceffio-console"
          TAGS=(-t "${IMAGE}:${VERSION}")
          case "$TAG" in
            *-*) echo "prerelease tag: '${IMAGE}:latest' is NOT updated" ;;
            *)   TAGS+=(-t "${IMAGE}:latest") ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f build/console/Dockerfile \
            "${TAGS[@]}" \
            --push .
          echo "Published: ${IMAGE}:${VERSION}"

      - name: Prove the image is pullable, anonymously
        # « Le build a dit pushed » ne prouve pas qu'un inconnu peut tirer
        # l'image : le paquet peut rester PRIVÉ et le build réussir quand
        # même. Ce pull se fait SANS identifiants — exactement ce que fait un
        # nouveau déploiement (crictl pull dans internal/console/deploy.go).
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull --platform linux/amd64 "ghcr.io/ceffio-suite/ceffio-console:${VERSION}"
          echo "anonymous pull of :${VERSION} succeeded"
