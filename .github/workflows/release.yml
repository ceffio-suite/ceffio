name: Release

# ONE DEFINITION OF "DONE" FOR A RELEASE.
#
# A release here is a Git tag AND a GitHub Release with downloadable binaries
# AND their checksums. All three are produced by this single workflow, from
# the tag. Nothing else creates releases: `ci.yml` deliberately does not react
# to tags, so a version is never built twice by two pipelines that could
# disagree about what they built.
#
# WHY CHECKSUMS ARE NOT OPTIONAL: this project installs software on hosts that
# then hold an organisation's data. A binary downloaded with no way to verify
# it is a binary whose integrity is merely assumed. The checksums file is
# published next to the assets so the operator can verify BEFORE executing.
#
# THE RELEASE IS ATTACHED TO A GREEN CI: the job below waits for and then
# checks the CI runs of the commit the tag points at, and refuses to publish
# if they did not succeed. A release out of a red build is a trap for the
# first user who hits the bug.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)publish, must already exist. e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: build, verify and publish ${{ github.event.ref_name || inputs.tag }}
    runs-on: ubuntu-24.04
    # Creating a Release is the one thing this job needs write access to.
    # Everything else stays read-only on purpose.
    permissions:
      contents: write
    outputs:
      # The console-image job derives its image tags from THIS output: the tag
      # is resolved and validated once, then reused. Two independent
      # resolutions could diverge (a re-publication through workflow_dispatch
      # with a hand-typed tag, for instance).
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A tag outside semver cannot be sorted, compared, or used to derive
          # "latest" — the release channel would become guesswork.
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid release tag: expected vMAJOR.MINOR.PATCH (suffix -rc.N allowed)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for the CI of the tagged commit, refuse it if not green
        # Verified against the commit the TAG points at, never against a
        # branch ref: "the last run of this ref" can be an older run, prior to
        # the change we mean to release.
        #
        # WAITING IS PART OF THE CHECK: the tag is pushed right after the
        # merge to main, while that merge's CI is still running. Reading the
        # status once would either fail for no reason or, worse, pass over an
        # empty list ("nothing to disprove").
        #
        # QUERIED BY WORKFLOW NAME, NOT BY CHECK-RUN NAME: the CI workflow is
        # named "CI"; matching its runs keeps this job out of its own verdict
        # (the Release job creates a check-run on the same commit as it runs —
        # filtering on job names inside it would make the release wait on
        # itself until the deadline and fail).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="$(git rev-list -n 1 "$TAG")"
          DEADLINE=$(( $(date +%s) + 900 ))
          while :; do
            gh run list --workflow CI --commit "$SHA" \
              --json databaseId,status,conclusion \
              --jq '.[] | "\(.databaseId) :: \(.status) :: \(.conclusion)"' \
              > /tmp/runs.txt || true
            if [ -s /tmp/runs.txt ] && ! grep -qvE ' :: completed :: (success|skipped)$' /tmp/runs.txt; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::CI of commit $SHA is not green (or was not found) after 15 minutes — nothing is published."
              cat /tmp/runs.txt || echo "(no CI run found)"
              exit 1
            fi
            sleep 20
          done
          cat /tmp/runs.txt
          echo "CI verified green on $SHA"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binaries
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X github.com/ceffio-suite/ceffio/internal/version.Binary=${TAG} -X github.com/ceffio-suite/ceffio/internal/version.Commit=${COMMIT} -X github.com/ceffio-suite/ceffio/internal/version.Date=${DATE}" \
              -o "dist/ceffio-linux-$ARCH" ./cmd/ceffio
          done
          ls -la dist/

      - name: Generate the SBOM of each binary
        # ONE SBOM PER BINARY, CycloneDX JSON, produced by Syft ON THE BINARY:
        # a Go binary carries its build information (module path, version,
        # sum), which is what makes this SBOM list the actual dependencies
        # rather than a copy of go.mod.
        #
        # SYFT IS INSTALLED BY A PINNED ACTION, and then CALLED DIRECTLY: the
        # wrapper action would name the file itself, and the release contract
        # below (and checksums.txt) needs exactly
        # `ceffio-linux-<arch>.cdx.json`.
        #
        # WHY THE SBOM EXISTS AT ALL: the Cyber Resilience Act will require it,
        # but the immediate reason is that an operator must be able to say what
        # runs on their machine — and prove it.
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Write the SBOMs
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            syft scan "file:dist/ceffio-linux-$ARCH" \
              -o "cyclonedx-json=dist/ceffio-linux-$ARCH.cdx.json" \
              --quiet
            # A SBOM WITHOUT COMPONENTS IS WORSE THAN NONE: it looks like a
            # proof and proves nothing. Go's build info should always yield some.
            COMPOSANTS="$(python3 -c "import json,sys; d=json.load(open('dist/ceffio-linux-$ARCH.cdx.json')); print(len(d.get('components', [])))")"
            echo "ceffio-linux-$ARCH: $COMPOSANTS components"
            test "$COMPOSANTS" -gt 0
          done

      - name: Checksums, after the SBOMs
        # THE SUMS COVER EVERYTHING THE RELEASE PUBLISHES, SBOMs included, so an
        # operator can verify the document they are about to read. Computing them
        # before the SBOMs existed is how a release ends up with files nobody can
        # check.
        run: |
          set -euo pipefail
          ( cd dist && sha256sum \
              ceffio-linux-amd64 ceffio-linux-arm64 \
              ceffio-linux-amd64.cdx.json ceffio-linux-arm64.cdx.json \
              > checksums.txt )
          cat dist/checksums.txt

      - name: Exercise what will be shipped
        # The native architecture is RUN, not just built — see ci.yml for why
        # arm64 is not executed on an amd64 runner.
        run: |
          set -euo pipefail
          ./dist/ceffio-linux-amd64 --help > /dev/null
          ./dist/ceffio-linux-amd64 install --help > /dev/null
          echo "the shipped amd64 binary starts"

      - name: Share the binaries with the console image job
        # THE IMAGE MUST CONTAIN THE RELEASE BINARIES, BYTE FOR BYTE.
        # The console-image job NEVER recompiles: a second compilation
        # (different date, different link order) would produce a binary
        # different from the one operators download and verify through
        # checksums.txt — the image would no longer be reproducible from the
        # release. That is exactly the defect of the former ceffio-console
        # repository.
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/ceffio-linux-amd64
            dist/ceffio-linux-arm64
          if-no-files-found: error

      - name: Write the release body
        # `generate_release_notes` keeps the changelog (the commits since the
        # previous tag); this body adds what a changelog cannot carry: how to
        # install, and how to verify the download.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          cat > RELEASE_BODY.md <<EOF
          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/installer/install.sh | sh -s -- install --domain <your-domain>
          \`\`\`

          Or download a binary directly:

          | File | Platform |
          |---|---|
          | \`ceffio-linux-amd64\` | x86_64 |
          | \`ceffio-linux-arm64\` | aarch64 |

          Software bill of materials: \`ceffio-linux-<arch>.cdx.json\` (CycloneDX JSON), covered by \`checksums.txt\`.

          ## Verify before running

          \`\`\`bash
          sha256sum -c --ignore-missing checksums.txt
          \`\`\`
          EOF

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ceffio ${{ steps.tag.outputs.tag }}
          # A -rc tag is a prerelease: the release channel must not offer it
          # as "latest", or every user gets the candidate.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/ceffio-linux-amd64
            dist/ceffio-linux-arm64
            dist/ceffio-linux-amd64.cdx.json
            dist/ceffio-linux-arm64.cdx.json
            dist/checksums.txt
          body_path: RELEASE_BODY.md
        env:
          GH_TOKEN: ${{ github.token }}

  # THE CONSOLE IMAGE IS PUBLISHED HERE, FROM THIS REPOSITORY, FROM THE
  # RELEASE BINARIES.
  #
  # It used to be published by the separate repository
  # ceffio-suite/ceffio-console, whose workflow cloned this one with
  # --depth 1 and RECOMPILED with Go 1.24 while go.mod requires 1.27.1: the
  # image corresponded to no verifiable release, and the compiler did not
  # honour the code's own contract. Here, the job consumes the `binaries`
  # artifact of the release job: what runs in the image is byte for byte what
  # operators download and verify through checksums.txt.
  #
  # WHY THE IMAGE IS NAMED ceffio AND NOT ceffio-console: a GHCR package
  # belongs to the repository that FIRST published it, and another repository
  # cannot push to it — the attempt fails with
  # `denied: permission_denied: write_package` even with `packages: write`
  # granted, because the permission is checked against the package's owner,
  # not against the workflow's own repository. `ghcr.io/ceffio-suite/
  # ceffio-console` was created by the former repository and stays with it.
  # Publishing under `ghcr.io/ceffio-suite/ceffio` creates a package owned by
  # THIS repository, which is what makes GITHUB_TOKEN sufficient and removes
  # the need for a personal token with a long-lived packages scope.
  #
  # Verified: the name was free (GHCR answers 403 to an anonymous token
  # request for a package that does not exist, and 200 for one that does).
  #
  # IF packages:write IS EVER REFUSED, the documented fallback is a PAT stored
  # in secrets.GHCR_TOKEN with the packages:write scope — replace
  # `password: ${{ github.token }}` with `password: ${{ secrets.GHCR_TOKEN }}`
  # in the login step. Not needed today: this repository owns the package.
  console-image:
    name: publish the console image (${{ needs.release.outputs.tag }})
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: read
      # Publishing to GHCR is this job's only write.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the release binaries
        # Never a recompilation: see the job header.
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: dist

      - name: Check the downloaded binaries against the release checksums
        # The artifact download goes through the GitHub API, not the release;
        # this check proves the artifact and the release published by the
        # previous job are the same files.
        run: |
          set -euo pipefail
          ls -la dist/
          # actions/download-artifact does NOT preserve the executable bit:
          # the files arrive in 0644. Restore it here, then assert it — a
          # `test -x` on a 0644 file fails, and that is exactly how this step
          # failed the first time it ever ran (v0.6.0), while the identical
          # step in ci.yml passed only because it happened to chmod first.
          chmod +x dist/ceffio-linux-amd64 dist/ceffio-linux-arm64
          test -x dist/ceffio-linux-amd64
          test -x dist/ceffio-linux-arm64
          # dist/checksums.txt is not in the artifact (it is not a binary):
          # download it from the release to compare. Retry, because the
          # release asset is not always servable the instant the release is
          # created, and this job starts seconds later.
          TAG="${{ needs.release.outputs.tag }}"
          for i in 1 2 3 4 5; do
            if curl -fsSL -o /tmp/checksums.txt \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/checksums.txt"; then
              break
            fi
            echo "checksums.txt not servable yet (attempt $i) — retrying in 5s"
            sleep 5
          done
          test -s /tmp/checksums.txt
          ( cd dist && sha256sum -c --ignore-missing /tmp/checksums.txt )

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the multi-architecture image
        # THE DOCKERFILE RECOMPILES NOTHING: it copies dist/ceffio-linux-$ARCH
        # (selected by TARGETARCH, provided by BuildKit per platform).
        # A "from scratch" image with no RUN instruction builds for arm64 on
        # an amd64 runner without emulation — there is nothing to execute.
        #
        # Tags: X.Y.Z always (project rule: a tag is a version, never a
        # floating untagged image); `latest` ONLY for a version with no
        # suffix — an -rc.1 must not become the version everyone pulls by
        # default.
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/ceffio-suite/ceffio"
          TAGS=(-t "${IMAGE}:${VERSION}")
          case "$TAG" in
            *-*) echo "prerelease tag: '${IMAGE}:latest' is NOT updated" ;;
            *)   TAGS+=(-t "${IMAGE}:latest") ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f build/console/Dockerfile \
            "${TAGS[@]}" \
            --sbom=true --provenance=mode=max \
            --push .
          echo "Published: ${IMAGE}:${VERSION}"

      - name: Prove the image carries its SBOM and its provenance
        # AN ATTESTATION IS PUBLISHED OR IT IS NOT: "the build said pushed" does
        # not prove the registry kept the attestation, and an empty one is worse
        # than none — it is a line in a report that nobody can check.
        #
        # The same reading an operator would do by hand, on the published image.
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.tag }}"
          VERSION="${VERSION#v}"
          IMAGE="ghcr.io/ceffio-suite/ceffio:${VERSION}"
          for ATTESTATION in SBOM Provenance; do
            VALEUR="$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .${ATTESTATION} }}")"
            echo "${ATTESTATION} of ${IMAGE}: $(echo "$VALEUR" | head -c 300)"
            if [ -z "$VALEUR" ] || [ "$VALEUR" = "null" ]; then
              echo "::error::${IMAGE} carries no ${ATTESTATION} attestation"
              exit 1
            fi
          done

      - name: Prove the image is pullable, anonymously
        # "The build said pushed" does not prove a stranger can pull the image:
        # the package can stay PRIVATE and the build succeed anyway. This pull
        # runs WITHOUT credentials — exactly what a new deployment does
        # (crictl pull in internal/console/deploy.go).
        #
        # It is also the check that would have caught the GHCR ownership
        # problem: a package owned by another repository refuses the push, and
        # a green build alone says nothing about whether the image is reachable.
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull --platform linux/amd64 "ghcr.io/ceffio-suite/ceffio:${VERSION}"
          echo "anonymous pull of :${VERSION} succeeded"
